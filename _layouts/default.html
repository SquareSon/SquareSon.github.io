<!doctype html>
<html lang="{{ page.lang | default: 'zh-CN' }}" class="no-js">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">{{ page.skip_label | default: "跳到正文" }}</a>
    {% include masthead.html %}

    <div id="main" role="main">
      <aside class="sidebar sticky" aria-label="{{ page.profile_label | default: '作者资料' }}">
        {% include author-profile.html %}
      </aside>

      <article class="page" itemscope itemtype="https://schema.org/ProfilePage">
        <div class="page__inner-wrap">
          <main id="main-content" class="page__content" itemprop="mainEntity" itemscope itemtype="https://schema.org/Person">
            <meta itemprop="name" content="Zi Fang">
            {{ content }}
          </main>
        </div>
      </article>
    </div>

    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/assistant.js' | relative_url }}" defer></script>
  </body>
</html>
