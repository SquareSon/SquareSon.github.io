{% assign is_en = false %}{% if page.lang == 'en' %}{% assign is_en = true %}{% endif %}
<div
  class="assistant-panel"
  data-assistant
  data-locale="{% if is_en %}en{% else %}zh{% endif %}"
  data-rag-endpoint="{{ site.rag_api_url }}"
>
  <form data-assistant-form>
    <div class="assistant-config">
      <div class="assistant-field">
        <label for="assistant-source">{% if is_en %}API source{% else %}API 来源{% endif %}</label>
        <select id="assistant-source" data-assistant-source disabled>
          <option value="auto">{% if is_en %}Auto / resilient routing{% else %}自动 / 可靠路由{% endif %}</option>
        </select>
      </div>
      <div class="assistant-status-field">
        <span class="assistant-config-label">{% if is_en %}RAG status{% else %}RAG 状态{% endif %}</span>
        <div class="assistant-status" data-mode="static" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span data-assistant-status>{% if is_en %}Static search ready{% else %}静态检索已就绪{% endif %}</span>
        </div>
      </div>
      <div class="assistant-field">
        <label for="assistant-model">{% if is_en %}Model{% else %}模型{% endif %}</label>
        <select id="assistant-model" data-assistant-model disabled>
          <option value="auto">{% if is_en %}Auto / static fallback{% else %}自动 / 静态降级{% endif %}</option>
        </select>
      </div>
    </div>
    <div class="assistant-chat-window">
      <div
        class="assistant-transcript"
        data-assistant-transcript
        data-empty-label="{% if is_en %}Your conversation will appear here.{% else %}问答记录将显示在这里。{% endif %}"
        role="log"
        aria-live="polite"
        aria-label="{% if is_en %}Conversation{% else %}对话记录{% endif %}"
      ></div>
      <div class="assistant-controls">
        <div class="assistant-field assistant-question-field">
          <label for="assistant-question">{% if is_en %}Question{% else %}问题{% endif %}</label>
          <textarea
            id="assistant-question"
            data-assistant-question
            maxlength="1000"
            required
            placeholder="{% if is_en %}Ask about research, publications, projects, or skills…{% else %}询问研究方向、论文、项目或技能……{% endif %}"
          ></textarea>
        </div>
        <div class="assistant-actions">
          <button class="assistant-submit" type="submit" data-assistant-submit>{% if is_en %}Ask{% else %}提问{% endif %}</button>
          <button class="assistant-reset" type="button" data-assistant-reset>{% if is_en %}New chat{% else %}新建对话{% endif %}</button>
        </div>
      </div>
    </div>
  </form>
  <div class="assistant-suggestions" aria-label="{% if is_en %}Suggested questions{% else %}推荐问题{% endif %}">
    {% if is_en %}
      <button type="button" data-question="What are Zi Fang's main research areas?">Research areas</button>
      <button type="button" data-question="What is the core idea behind GLA-NeRF?">GLA-NeRF</button>
      <button type="button" data-question="How does UPI-NeRF use acoustic physics?">UPI-NeRF</button>
    {% else %}
      <button type="button" data-question="方子的主要研究方向是什么？">研究方向</button>
      <button type="button" data-question="GLA-NeRF 的核心思路是什么？">GLA-NeRF</button>
      <button type="button" data-question="UPI-NeRF 如何引入声学物理先验？">UPI-NeRF</button>
    {% endif %}
  </div>
</div>
